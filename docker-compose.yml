services:
  prospect-entry-mcp:
    build: .
    container_name: market-intel-prospect-entry-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "server.py", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
